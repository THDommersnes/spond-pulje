<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Spond puljegenerator</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      font-size: 18px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 28px;
    }

    h2 {
      font-size: 22px;
      margin-top: 25px;
    }

    #playerList li {
      margin: 12px 0;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    select {
      font-size: 18px;
      padding: 8px;
      border-radius: 6px;
    }

    button {
      font-size: 20px;
      padding: 12px 18px;
      margin-top: 15px;
      width: 100%;
      border-radius: 8px;
    }

    input[type="file"] {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .group-box {
      background: #f3f3f3;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .group-box ul {
      margin-top: 10px;
      padding-left: 20px;
    }
  </style>
</head>

<body>
  <h1>Spond puljegenerator</h1>

  <input type="file" id="fileInput" accept=".xlsx,.xls" multiple />
  <button id="importButton">Importer Spond-fil</button>

  <h2>Spillere</h2>
  <ul id="playerList"></ul>

  <button id="generateGroupsButton">Generer grupper</button>

  <!-- ⭐ Seksjoner for grupper -->
  <div class="group-box">
    <h2>Gr1</h2>
    <ul id="gr1List"></ul>
  </div>

  <div class="group-box">
    <h2>Gr2</h2>
    <ul id="gr2List"></ul>
  </div>

  <div class="group-box">
    <h2>Gr3</h2>
    <ul id="gr3List"></ul>
  </div>

  <div class="group-box">
    <h2>Keeper</h2>
    <ul id="keeperList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
