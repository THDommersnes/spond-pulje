<!-- rebuild -->
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Spond puljegenerator</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Excel-bibliotek -->
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    /* 🔥 Hindrer sideveis scrolling på iPhone + Android */
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      font-size: 18px;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
    }

    /* ⭐ Logo-stil med hvit outline */
    .logo {
      display: block;
      margin: 0 auto 20px auto;
      max-width: 140px; /* perfekt størrelse for mobil */
      height: auto;
      border-radius: 50%;
      padding: 6px; /* gir litt luft rundt outline */
      background: white; /* hvit outline */
      box-shadow: 0 0 8px rgba(0,0,0,0.15); /* subtil dybde */
    }

    h1 {
      margin-bottom: 20px;
      font-size: 28px;
      text-align: center;
    }

    h2 {
      font-size: 22px;
      margin-top: 25px;
    }

    #playerList li {
      margin: 12px 0;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    /* 🔥 Smalere dropdown → ingen horisontal scrolling */
    select {
      font-size: 18px;
      padding: 8px;
      border-radius: 6px;
      min-width: 100px;
    }

    button {
      font-size: 20px;
      padding: 12px 18px;
      margin-top: 15px;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
    }

    input[type="file"] {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .group-box {
      background: #f3f3f3;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .group-box ul {
      margin-top: 10px;
      padding-left: 20px;
    }

    /* Super-mobilvennlig layout (iPhone + Android) */
    @media (max-width: 600px) {

      body {
        font-size: 15px;
        padding: 10px;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 15px;
      }

      h2 {
        font-size: 18px;
        margin-top: 20px;
      }

      button {
        font-size: 17px;
        padding: 10px 14px;
        margin-top: 12px;
      }

      select {
        font-size: 15px;
        padding: 6px;
        min-width: 90px; /* enda litt smalere på mobil */
      }

      #playerList li {
        padding: 6px 0;
        margin: 8px 0;
      }

      .group-box {
        padding: 12px;
        margin-top: 15px;
      }

      .group-box ul {
        padding-left: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- ⭐ Logoen flettet inn -->
  <img src="logo.png" alt="Nest-Sotra logo" class="logo">

  <h1>Spond puljegenerator</h1>

  <input type="file" id="fileInput" accept=".xlsx,.xls" multiple />
  <button id="importButton">Importer Spond-fil</button>

  <h2>Spillere</h2>
  <ul id="playerList"></ul>

  <!-- ⭐ Generer-knappen fjernet (auto-oppdatering i script.js) -->
  <button id="copyButton">Kopier puljer</button>

  <!-- ⭐ Seksjoner for grupper -->
  <div class="group-box">
    <h2>Gr1</h2>
    <ul id="gr1List"></ul>
  </div>

  <div class="group-box">
    <h2>Gr2</h2>
    <ul id="gr2List"></ul>
  </div>

  <div class="group-box">
    <h2>Gr3</h2>
    <ul id="gr3List"></ul>
  </div>

  <div class="group-box">
    <h2>Keeper</h2>
    <ul id="keeperList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
